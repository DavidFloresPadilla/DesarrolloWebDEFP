<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabla de operaciones</title>
</head>
<body>
    <h1>Generar tabla de operaciones</h1>
    <form method="post" action="tabla.php">
        <label for="operacion">Operación:</label>
        <select name="operacion" id="operacion" style="background-color:#F79646;">
            <option value="suma">Suma</option>
            <option value="resta">Resta</option>
            <option value="multiplicacion">Multiplicación</option>
            <option value="division">División</option>
        </select><br><br>

        <label for="n">Número n:</label>
        <input type="number" name="n" id="n" min="1" style="background-color:#F79646;"><br><br>

        <input type="submit" value="Generar" style="background-color:#F79646;">
    </form>
</body>
</html>
